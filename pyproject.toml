[project]
name = "llm-tools"
version = "0.1.0"
description = "Run an MCP tool from Home Assistant without an agent - call any LLM tool by name from an automation, script, sentence trigger or dashboard button"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "parkghost"}
]
keywords = ["home-assistant", "hacs", "mcp", "model-context-protocol", "llm", "tools", "automation", "voice-assistant"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "voluptuous>=0.15.0",
    "voluptuous-openapi>=0.4.1",
    "probatio>=0.11.4",
    "pyyaml>=6.0",
]
dev = [
    "ruff>=0.1.0",
    "pyright>=1.1.390",
    "types-PyYAML>=6.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_components*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ASYNC", "B", "SIM", "RUF013"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.llm_tools"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["custom_components"]
exclude = ["tests", "**/__pycache__"]
typeCheckingMode = "standard"
useLibraryCodeForTypes = true
# homeassistant is not installed in this repo (mocked in tests); suppress missing-import noise
reportMissingImports = "none"
reportMissingTypeStubs = "none"

[tool.coverage.run]
source = ["custom_components"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.commitizen]
version = "0.1.0"
version_files = [
    "pyproject.toml:version",
    "custom_components/llm_tools/manifest.json:version",
]
tag_format = "$version"
annotated_tag = true
update_changelog_on_bump = false
pre_bump_hooks = ["uv lock", "git add uv.lock"]
major_version_zero = true

[dependency-groups]
dev = ["ruff>=0.14.11", "pyright>=1.1.390", "commitizen>=4.0", "pre-commit>=4.0"]
test = ["pytest>=9.0", "pytest-asyncio>=1.0", "pytest-cov>=7.0", "voluptuous>=0.15.0", "voluptuous-openapi>=0.4.1", "probatio>=0.11.4", "pyyaml>=6.0"]
